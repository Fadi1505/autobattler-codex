<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101313">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Autobattler">
  <title>Autobattler</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23101411"/><path d="M18 42h28l-4 10H22l-4-10Zm2-18 8 7 4-15 4 15 8-7-3 16H23L20 24Z" fill="%23f2b84b"/></svg>'>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="draftScreen" class="screen active">
      <header class="app-header">
        <div>
          <p class="eyebrow">Autobattler 2.5D Prototype</p>
          <h1>autobattler</h1>
        </div>
        <div id="draftSlots" class="draft-slots" aria-label="Player draft slots"></div>
      </header>

      <main class="draft-layout">
        <section>
          <div class="section-title">
            <h2>Choose Hero</h2>
            <span>8 contenders</span>
          </div>
          <div id="heroGrid" class="hero-grid"></div>
        </section>

        <aside id="heroInspector" class="inspector"></aside>
      </main>
    </section>

    <section id="gameScreen" class="screen">
      <header class="game-header">
        <div class="identity">
          <div id="playerPortrait" class="mini-portrait"></div>
          <div>
            <p class="eyebrow">Your Hero</p>
            <h1 id="playerName">Hero</h1>
          </div>
        </div>
        <div class="top-meters">
          <div class="meter-pill">
            <span>Round</span>
            <strong id="roundValue">1</strong>
          </div>
          <div class="meter-pill">
            <span>Gold</span>
            <strong id="goldValue">0</strong>
          </div>
          <div class="meter-pill">
            <span>Health</span>
            <strong id="healthValue">30</strong>
          </div>
          <button id="newGameBtn" class="icon-button" title="New game" aria-label="New game">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7V3h-5.7l2 2A10 10 0 1 0 22 12h-2A8 8 0 1 1 4 12Z"/></svg>
          </button>
        </div>
      </header>

      <nav class="mobile-game-nav" aria-label="Game sections">
        <button type="button" class="active" data-scroll-target="arenaPanel">Arena</button>
        <button type="button" data-scroll-target="shopPanel">Shop</button>
        <button type="button" data-scroll-target="heroKitPanel">Hero</button>
        <button type="button" data-scroll-target="standingsPanel">Standings</button>
      </nav>

      <main class="game-layout">
        <section id="arenaPanel" class="arena-section">
          <div class="arena-toolbar">
            <div>
              <p class="eyebrow">Arena</p>
              <h2 id="matchTitle">Match</h2>
            </div>
            <div class="combat-actions">
              <button id="fightBtn" class="primary-button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.4 4.3 20 2l-2.3 5.6L20 10l-3 1.4-1.4 3L13 12l-6.8 6.8a2 2 0 0 1-2.8-2.8L10.2 9 8 6.7l3-1.4 1.4-3 2 2Z"/></svg>
                Fight
              </button>
              <button id="nextRoundBtn" class="secondary-button" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l11-7L5 5Zm12 0h2v14h-2V5Z"/></svg>
                Next
              </button>
            </div>
          </div>

          <div class="arena-board">
            <div class="arena-2d-scene" aria-hidden="true"></div>
            <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>

            <div class="fighter fighter-left">
              <div id="leftPortrait" class="fighter-portrait"></div>
              <div class="fighter-info">
                <div class="name-row">
                  <strong id="leftName">You</strong>
                  <span id="leftShield" class="shield-badge">0</span>
                </div>
                <div class="bar hp-bar"><span id="leftHpBar"></span></div>
                <div class="bar mana-bar"><span id="leftManaBar"></span></div>
              </div>
            </div>

            <div id="roundResult" class="round-result"></div>

            <div class="fighter fighter-right">
              <div id="rightPortrait" class="fighter-portrait"></div>
              <div class="fighter-info">
                <div class="name-row">
                  <strong id="rightName">Opponent</strong>
                  <span id="rightShield" class="shield-badge">0</span>
                </div>
                <div class="bar hp-bar"><span id="rightHpBar"></span></div>
                <div class="bar mana-bar"><span id="rightManaBar"></span></div>
              </div>
            </div>
          </div>

          <div id="combatAbilityGrid" class="ability-strip"></div>

          <div id="roundSummary" class="round-summary"></div>

          <div id="combatLog" class="combat-log" aria-live="polite"></div>
        </section>

        <aside id="shopPanel" class="shop-section">
          <div class="section-title compact">
            <h2>Card Shop</h2>
            <div class="shop-actions">
              <button id="shopLockBtn" class="icon-button" title="Lock shop" aria-label="Lock shop">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Zm2 0h6V8a3 3 0 0 0-6 0v2Z"/></svg>
              </button>
              <button id="rerollBtn" class="icon-button" title="Refresh shop" aria-label="Refresh shop">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 0 0 4 12H2A10 10 0 0 1 19.1 5l1.9-2v6h-6l2.7-2.7ZM6.3 17.7A8 8 0 0 0 20 12h2A10 10 0 0 1 4.9 19L3 21v-6h6l-2.7 2.7Z"/></svg>
              </button>
            </div>
          </div>
          <div id="shopGrid" class="shop-grid"></div>
        </aside>

        <aside class="stats-section">
          <div id="heroKitPanel" class="section-title compact">
            <h2>Hero Kit</h2>
            <span id="heroRole">Role</span>
          </div>
          <div id="heroStatsGrid" class="hero-stats-grid"></div>
          <div id="heroAbilityList" class="hero-ability-list"></div>

          <div class="section-title compact">
            <h2>Upgrades</h2>
            <span id="powerValue">0 power</span>
          </div>
          <div id="upgradeGrid" class="upgrade-grid"></div>

          <div id="standingsPanel" class="section-title compact standings-title">
            <h2>Standings</h2>
            <span id="aliveValue">8 alive</span>
          </div>
          <div id="standingsList" class="standings-list"></div>
        </aside>
      </main>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
